<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b8155a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Viral Fleek POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: phone-first till with bottom tabs; at laptop width a left rail, product wall and a pinned basket. */
:root{
  --bg:#f7f2f5; --surface:#ffffff; --sunk:#f1e9ee; --ink:#26131f; --muted:#7c6573; --line:#e6d9e1;
  --accent:#b8155a; --accent-ink:#ffffff; --soft:#fbe4ee;
  --good:#1d7a4c; --good-soft:#e2f4ea; --warn:#a96300; --warn-soft:#fbefd9; --bad:#b3261e; --bad-soft:#fbe3e1;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#150d12; --surface:#20151c; --sunk:#1a1117; --ink:#f6eaf1; --muted:#b59cab; --line:#3a2933;
  --accent:#ff5c9c; --accent-ink:#2b0617; --soft:#3b1828;
  --good:#5fd39a; --good-soft:#163527; --warn:#f2b54e; --warn-soft:#3a2a0f; --bad:#ff8a80; --bad-soft:#3f1714; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#150d12; --surface:#20151c; --sunk:#1a1117; --ink:#f6eaf1; --muted:#b59cab; --line:#3a2933;
  --accent:#ff5c9c; --accent-ink:#2b0617; --soft:#3b1828;
  --good:#5fd39a; --good-soft:#163527; --warn:#f2b54e; --warn-soft:#3a2a0f; --bad:#ff8a80; --bad-soft:#3f1714; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
.app{display:grid;grid-template-rows:auto 1fr auto;height:100%}
header.top{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;font:500 10px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.top .grow{flex:1;min-width:0}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);min-width:0}
.sync span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--good)} .dot.wait{background:var(--warn)} .dot.off{background:var(--bad)}
.who{display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);font-size:12px;font-weight:600;white-space:nowrap}
.chip.owner{background:var(--soft);border-color:transparent;color:var(--accent)}
main{overflow:auto;min-height:0}
.view{padding-block:16px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;max-width:1280px;margin:0 auto;width:100%}
nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{background:none;border:0;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs .wide{display:none}
@media (min-width:900px){
  .app{grid-template-columns:200px 1fr;grid-template-rows:auto 1fr}
  header.top{grid-column:1/3}
  nav.tabs{grid-row:2;grid-column:1;display:flex;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:12px 10px;gap:2px}
  nav.tabs button{flex-direction:row;justify-content:flex-start;gap:10px;padding:10px 12px;border-radius:10px;font-size:14px}
  nav.tabs button[aria-current="page"]{background:var(--soft)}
  nav.tabs .wide{display:flex} nav.tabs .narrow{display:none}
  main{grid-row:2;grid-column:2}
}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.title{font-family:var(--display);font-weight:500;font-size:20px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
.label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.big{min-height:54px;font-size:17px;width:100%}
input.f,select.f,textarea.f{width:100%;min-height:44px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
textarea.f{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:12px;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.mute{background:var(--sunk);color:var(--muted)} .pill.acc{background:var(--soft);color:var(--accent)}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--ink);font-size:13px}
.banner b{color:var(--warn)}
.empty{padding:32px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty strong{color:var(--ink);font-size:16px}
/* Sell */
.sell{display:grid;gap:16px}
@media (min-width:900px){.sell{grid-template-columns:minmax(0,1fr) 360px;align-items:start}.basket{position:sticky;top:16px}.mobile-bar{display:none!important}}
@media (max-width:899px){.sell .basket{display:none}}
.search{position:relative}
.search input{padding-left:40px;min-height:48px;font-size:16px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.cats button{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px}
.cats button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;padding:12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);min-height:108px;position:relative}
.tile:hover{border-color:var(--accent)}
.tile:active{transform:scale(.98)}
.tile .nm{font-weight:600;line-height:1.25}
.tile .vr{font-size:12px;color:var(--muted)}
.tile .ft{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:6px}
.tile .pr{font-weight:700}
.tile .sw{position:absolute;top:0;left:12px;right:12px;height:3px;border-radius:0 0 3px 3px}
.basket .lines{display:flex;flex-direction:column;max-height:46vh;overflow:auto;margin:0 -4px}
.line{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.line .q{display:flex;align-items:center;gap:6px}
.qb{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;line-height:1}
.tot{display:flex;flex-direction:column;gap:4px;padding-top:10px}
.tot .r{display:flex;justify-content:space-between}
.tot .grand{font-family:var(--display);font-size:24px;font-weight:700;padding-top:6px}
.mobile-bar{position:sticky;bottom:0;margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--ink);color:var(--bg);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.mobile-bar .grow{flex:1;min-width:0}
.mobile-bar .btn{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* Tables & lists */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--sunk)}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.meter{height:6px;border-radius:6px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi b{display:block;font-family:var(--display);font-weight:500;font-size:22px;margin-top:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 14px;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
/* Modal */
.scrim{position:fixed;inset:0;background:rgba(20,8,15,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding-top:env(safe-area-inset-top,0px)}
@media (min-width:700px){.scrim{align-items:center;padding:24px}}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.sheet{border-radius:18px;padding:22px}}
.sheet.wide{max-width:820px}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1}
.methods{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.methods button{min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px}
.methods button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);color:var(--accent)}
.receipt{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:16px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;white-space:pre-wrap;line-height:1.5;overflow-x:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
@media (min-width:900px){.toast{bottom:24px}}
/* Login */
.login{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.login .box{width:100%;max-width:360px;display:flex;flex-direction:column;gap:18px;text-align:center}
.login h1{font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:-.03em;line-height:1}
.login h1 em{font-style:normal;color:var(--accent)}
.who-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.who-pick button{padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.who-pick button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);color:var(--accent)}
.pins{display:flex;justify-content:center;gap:12px;height:18px}
.pins i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.pins i.on{background:var(--accent);border-color:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:58px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:22px;font-weight:600}
.err{color:var(--bad);font-size:13px;min-height:18px}
/* Bookings & customers */
.agenda{display:flex;flex-direction:column;gap:6px}
.slot{display:flex;gap:14px;align-items:center;min-height:44px;padding:0 14px;border:1px dashed var(--line);border-radius:10px;background:transparent;color:var(--muted);text-align:left;font-size:13px}
.slot:hover{border-color:var(--accent);color:var(--accent)}
.slot .num{font-weight:700;color:var(--ink);min-width:46px}
.slot.past{opacity:.5}
.bk{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent)}
.bk-arrived{border-left-color:var(--warn)} .bk-done{border-left-color:var(--good)} .bk-noshow{border-left-color:var(--bad);opacity:.75} .bk-cancelled{border-left-color:var(--line);opacity:.6}
.daynav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pick{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.pick:hover{border-color:var(--accent)}
.custrow{cursor:pointer}
.custrow:hover td{background:var(--sunk)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand" id="brand">Viral Fleek<small>Point of sale</small></div>
    <div class="grow"><div class="sync" id="sync"><i class="dot"></i><span>Starting…</span></div></div>
    <div class="who" id="who"></div>
  </header>
  <nav class="tabs" id="nav" aria-label="Sections"></nav>
  <main id="main"></main>
</div>
<div id="layer"></div>

<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script>
(function(){
"use strict";
/* ---------- utilities ---------- */
const $=s=>document.querySelector(s);
const h=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
// Money is stored in thebe (100 thebe = P1) as integers.
const P=t=>{const n=Math.round(+t||0),a=Math.abs(n);return (n<0?'−':'')+'P'+Math.floor(a/100).toLocaleString('en')+'.'+String(a%100).padStart(2,'0')};
const toT=v=>{const n=parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,''));return isFinite(n)?Math.round(n*100):0};
const asP=t=>(Math.round(+t||0)/100).toFixed(2);
const pad=n=>String(n).padStart(2,'0');
const dayStr=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(ds,n)=>{const d=new Date(ds+'T12:00:00');d.setDate(d.getDate()+n);return dayStr(d)};
const niceDay=ds=>{if(!ds)return '';const d=new Date(ds+'T12:00:00');return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})};
const niceTime=ts=>new Date(ts).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('vf-pos:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let x=0;for(const c of 'vf-pos:'+s)x=(x*31+c.charCodeAt(0))|0;return 'w'+x}}

const CATS=['Clothing','Weaves & Hair','Laundry Pods','Nails & Services','Other'];
const CAT_PFX={'Clothing':'CL','Weaves & Hair':'WV','Laundry Pods':'LP','Nails & Services':'SV','Other':'OT'};
const CAT_SW={'Clothing':'var(--accent)','Weaves & Hair':'var(--warn)','Laundry Pods':'var(--good)','Nails & Services':'var(--muted)','Other':'var(--line)'};
const METHODS=['Cash','Orange Money','MyZaka','Smega','EFT'];
const isService=p=>p&&p.track===false;

/* ---------- local-first store with cloud sync (Supabase) ---------- */
const CFG=window.POS_CONFIG||{};
const COLS=['products','sales','laybys','cashups','settings','customers','bookings','expenses','statements'];
const WINDOW={sales:{f:'day',d:62},cashups:{f:'day',d:62},expenses:{f:'day',d:100},bookings:{f:'date',d:62}};
let sb=null,SHOP=null,chan=null,authErr='';
const K=k=>'pos:'+(SHOP?SHOP.id:'none')+':'+k;
const mem={};COLS.forEach(c=>mem[c]={});
let outbox=[],lastSync=null;
let mode='connecting', syncErr=null, retryT=null, flushing=false, saveT=null, refreshing=false;
function loadLocal(){COLS.forEach(c=>mem[c]=ls.get(K(c),{})||{});outbox=ls.get(K('outbox'),[])||[];lastSync=ls.get(K('lastSync'),null)}
const persist=()=>{clearTimeout(saveT);saveT=setTimeout(()=>{if(!SHOP)return;let ok=true;COLS.forEach(c=>{ok=ls.set(K(c),mem[c])&&ok});ok=ls.set(K('outbox'),outbox)&&ok;ls.set(K('lastSync'),lastSync);if(!ok)toast('This device is out of storage space. Get online so the till can sync before selling more.')},200)};
function merge(a,b){const o=Object.assign({},a||{});for(const k in b){const v=b[k];if(v&&typeof v==='object'&&!Array.isArray(v)&&o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k]))o[k]=merge(o[k],v);else o[k]=clone(v)}return o}
const pending=(c,id)=>outbox.some(o=>o.col===c&&o.id===id);
function write(col,id,op,data){
  if(op==='set')mem[col][id]=clone(data);else if(op==='update')mem[col][id]=merge(mem[col][id],data);else delete mem[col][id];
  outbox.push({col,id,op,data:op==='delete'?null:clone(data)});persist();renderSync();flush();
}
function scheduleRetry(ms){clearTimeout(retryT);retryT=setTimeout(()=>{flush();if(mode==='offline')refresh()},ms||15000)}
async function flush(){
  if(!sb||!SHOP||flushing||!outbox.length)return;flushing=true;renderSync();
  try{
    while(outbox.length){
      const o=outbox[0];let res;
      try{
        if(o.op==='set')res=await sb.from('docs').upsert({shop_id:SHOP.id,col:o.col,id:o.id,data:o.data});
        else if(o.op==='update')res=await sb.rpc('doc_update',{p_shop:SHOP.id,p_col:o.col,p_id:o.id,p_patch:o.data});
        else res=await sb.from('docs').delete().match({shop_id:SHOP.id,col:o.col,id:o.id});
      }catch(e){res={error:{message:String(e)}}}
      const err=res&&res.error;
      if(!err){outbox.shift();lastSync=Date.now();syncErr=null;if(mode!=='online'&&chan)mode='online';persist();continue}
      const code=String(err.code||''),msg=String(err.message||'');
      if(code==='P0002'){outbox.shift();const full=mem[o.col][o.id];if(full)outbox.unshift({col:o.col,id:o.id,op:'set',data:clone(full)});persist();continue}
      if(code==='42501'||/row-level security|permission denied/i.test(msg)){syncErr='The server refused to save. The shop account may be paused. Contact your system provider. Your sales are safe on this device.';break}
      if(code==='PGRST301'||code==='PGRST303'||/jwt|token/i.test(msg)){syncErr='Your login has expired. Go to Settings › Sign out, then sign in again. Your sales are safe on this device.';break}
      if(/^(22|23)/.test(code)){outbox.shift();persist();console.warn('Dropped a change the database rejected',o,err);continue}
      mode='offline';scheduleRetry(12000);break;
    }
  }finally{flushing=false;renderSync()}
}
async function fetchCol(col,all){
  const out=[];const size=1000;let from=0;const w=!all&&WINDOW[col];
  for(;;){
    let q=sb.from('docs').select('id,data').eq('shop_id',SHOP.id).eq('col',col);
    if(w)q=q.gte('data->>'+w.f,addDays(dayStr(),-w.d));
    const {data,error}=await q.order('id').range(from,from+size-1);
    if(error)throw error;out.push(...data);if(data.length<size)break;from+=size;
  }
  return out;
}
async function refresh(){
  if(!sb||!SHOP||refreshing)return;refreshing=true;
  try{
    for(const col of COLS){
      const rows=await fetchCol(col,false);const seen=new Set();
      rows.forEach(r=>{seen.add(r.id);if(!pending(col,r.id))mem[col][r.id]=r.data});
      const w=WINDOW[col],cut=w&&addDays(dayStr(),-w.d);
      for(const id in mem[col])if(!seen.has(id)&&!pending(col,id)&&(!w||String(mem[col][id][w.f]||'')>=cut))delete mem[col][id];
    }
    lastSync=Date.now();syncErr=null;if(chan)mode='online';persist();dataChanged();flush();
  }catch(e){mode='offline';scheduleRetry(15000)}
  finally{refreshing=false;renderSync()}
}
function listen(){
  if(chan)sb.removeChannel(chan);
  chan=sb.channel('shop-'+SHOP.id).on('postgres_changes',{event:'*',schema:'public',table:'docs',filter:'shop_id=eq.'+SHOP.id},p=>{
    const r=(p.new&&p.new.col)?p.new:p.old;if(!r||r.shop_id!==SHOP.id||!COLS.includes(r.col)||pending(r.col,r.id))return;
    if(p.eventType==='DELETE')delete mem[r.col][r.id];else mem[r.col][r.id]=p.new.data;
    lastSync=Date.now();persist();dataChanged();
  }).subscribe(st=>{if(st==='SUBSCRIBED'){mode='online';refresh()}else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){mode='offline';renderSync()}});
}
window.addEventListener('online',()=>{flush();refresh()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&SHOP){flush();if(Date.now()-(lastSync||0)>120000)refresh()}});

function prune(){const cut=addDays(dayStr(),-62);let n=0;for(const id in mem.sales){if((mem.sales[id].day||'')<cut&&!pending('sales',id)){delete mem.sales[id];n++}}if(n)persist()}

function cartTotals(){const sub=cart.lines.reduce((s,l)=>s+l.price*l.qty,0);let disc=cart.discType==='pct'?Math.round(sub*(+cart.disc||0)/100):Math.min(sub,+cart.disc||0);const discPct=sub?disc/sub*100:0;return {sub,disc,total:sub-disc,discPct,count:cart.lines.reduce((s,l)=>s+l.qty,0)}}
function addToCart(id){
  const p=mem.products[id];if(!p)return;const res=reservedMap();const st=stockState(Object.assign({id},p),res);
  const ln=cart.lines.find(l=>l.pid===id);const inCart=ln?ln.qty:0;
  if(!isService(p)&&st.avail-inCart<=0)toast('Stock shows none left for '+label(p)+'. Sale allowed; check the shelf and recount.');
  if(ln)ln.qty++;else cart.lines.push({pid:id,name:p.name,variant:p.variant||'',cat:p.cat,price:+p.price||0,cost:+p.cost||0,qty:1,track:p.track!==false});
  drawBasket();
}

/* payment */
let pay=null;
function needsApproval(){const t=cartTotals();return !isOwner()&&t.disc>0&&t.discPct>S().staffDiscMax+0.001}
function openPay(){
  if(!cart.lines.length)return;
  pay={pays:cart.prepaid?[{m:'Booking deposit',a:Math.min(cart.prepaid,cartTotals().total),ref:'',locked:true}]:[],method:'Cash',approved:!needsApproval()};drawPay();
}
function drawPay(){
  const t=cartTotals();const paid=pay.pays.reduce((s,p)=>s+p.a,0);const left=Math.max(0,t.total-paid);const change=Math.max(0,paid-t.total);
  const ok=paid>=t.total&&pay.approved;const cash=pay.method==='Cash'&&left>0;
  modal(hd('Take payment','Total '+P(t.total))+
   (pay.approved?'':'<div class="banner"><b>Owner approval needed.</b> Discount is '+t.discPct.toFixed(1)+'%, above the staff limit of '+S().staffDiscMax+'%.<input class="f num" style="max-width:140px" id="appin" type="password" inputmode="numeric" maxlength="4" placeholder="Owner PIN"><button class="btn sm" data-act="approve">Approve</button></div>')+
   '<div class="kpis"><div class="kpi"><span class="label">Still to pay</span><b class="num">'+P(left)+'</b></div>'+(paid?'<div class="kpi"><span class="label">Change due</span><b class="num">'+P(change)+'</b></div>':'')+'</div>'+
   (pay.pays.length?'<div class="tbl-wrap"><table><tbody>'+pay.pays.map((p,i)=>'<tr><td>'+h(p.m==='Cash'?'Cash tendered':p.m)+(p.ref?' <span class="sub">'+h(p.ref)+'</span>':'')+'</td><td class="r num">'+P(p.a)+'</td><td class="r">'+(p.locked?'<span class="sub">Paid at booking</span>':'<button class="btn sm ghost" data-act="paydel" data-i="'+i+'">Remove</button>')+'</td></tr>').join('')+'</tbody></table></div>':'')+
   (left>0?'<div class="label">Payment method</div><div class="methods" role="group">'+METHODS.map(m=>'<button data-act="pm" data-m="'+m+'" aria-pressed="'+(pay.method===m)+'">'+m+'</button>').join('')+'</div>'+
   (cash?'<label class="fld"><span>Cash tendered by customer</span><input class="f num" id="pamt" inputmode="decimal" placeholder="'+asP(left)+'" autofocus style="font-size:22px;min-height:56px"></label>'+
     '<div class="row">'+[left,...[2000,5000,10000,20000,50000].filter(v=>v>left)].slice(0,5).map(v=>'<button class="btn sm" data-act="quick" data-v="'+v+'">'+(v===left?'Exact ':'')+P(v)+'</button>').join('')+'</div>'+
     '<div id="livechg" class="panel" aria-live="polite"></div>'
   :'<div class="grid2"><label class="fld"><span>Amount</span><input class="f num" id="pamt" inputmode="decimal" value="'+asP(pay.draft&&pay.draft.a?pay.draft.a:left)+'"></label><label class="fld"><span>'+(pay.method==='EFT'?'Bank reference':'Transaction ID')+' · or paste the SMS</span><input class="f" id="pref" autocomplete="off" value="'+h(pay.draft?pay.draft.ref:'')+'" placeholder="Long-press, then Paste the payment SMS" autofocus></label></div><div id="refhint" class="sub"></div>'+refSugHTML(left)+
     (pay.method==='EFT'?'<div class="sub">EFT sales stay marked <b>pending</b> until the money shows on the bank statement and the owner confirms it in Cash-up.</div>':''))+
   '<button class="btn" data-act="payadd">'+(cash?'Add cash and pay the rest another way':'Add '+h(pay.method)+' payment')+'</button>':'')+
   '<button class="btn primary big" id="paydone" data-act="paydone" '+(ok?'':'disabled')+'>Complete sale</button>');
  if(cash){const inp=$('#pamt');const upd=()=>{const v=inp.value.trim();const tnd=toT(v);const el=$('#livechg');const btn=$('#paydone');
      if(!v){el.innerHTML='<div class="label">Change to give</div><div class="sub">Type the cash the customer hands over, or tap a note.</div>';btn.disabled=true;btn.textContent='Complete sale';return}
      if(tnd<left){el.style.background='var(--warn-soft)';el.innerHTML='<div class="label">Short</div><b class="num" style="font-family:var(--display);font-size:30px;color:var(--warn)">'+P(left-tnd)+'</b><div class="sub">Collect more cash, or add this and take the rest by mobile money or EFT.</div>';btn.disabled=true;btn.textContent='Complete sale';return}
      el.style.background='var(--good-soft)';el.innerHTML='<div class="label">Change to give</div><b class="num" style="font-family:var(--display);font-size:34px;color:var(--good)">'+P(tnd-left)+'</b><div class="sub num">Tendered '+P(tnd)+' − due '+P(left)+'</div>';
      btn.disabled=!pay.approved;btn.textContent=tnd>left?'Give '+P(tnd-left)+' change · complete sale':'Complete sale';};
    inp.addEventListener('input',upd);inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!$('#paydone').disabled)$('#paydone').click()});pay.updChange=upd;upd();}else if(left>0)wireRef(left);
}
function finishPay(){
  const t=cartTotals();const paid=pay.pays.reduce((s,p)=>s+p.a,0);const left=t.total-paid;
  if(left>0&&pay.method==='Cash'){const tnd=toT(($('#pamt')||{}).value);if(tnd<left){toast('Cash tendered is less than what is due');return}pay.pays.push({m:'Cash',a:tnd,ref:''})}
  completeSale();
}
function completeSale(){
  const t=cartTotals();const now=Date.now();const id=uid();const s=S();
  const paid=pay.pays.reduce((a,p)=>a+p.a,0);const change=Math.max(0,paid-t.total);
  // change only comes out of cash
  const sale={no:nextNo('VF'),ts:now,day:dayStr(),user:me.role,items:cart.lines.map(l=>({pid:l.pid,name:l.name,variant:l.variant,cat:l.cat,qty:l.qty,price:l.price,cost:l.cost,track:l.track})),sub:t.sub,disc:t.disc,total:t.total,pays:pay.pays.map(p=>({m:p.m,a:p.a,ref:p.ref||''})),change,cust:clone(cart.cust),status:'ok',eftOk:{}};
  sale.pays.forEach((p,i)=>{p.id=sale.no+'-'+(i+1)});
  if(cart.bookingId){sale.bookingId=cart.bookingId}
  write('sales',id,'set',sale);
  pay.pays.forEach((p,i)=>{if(p.line&&mem.statements[p.line.sid])setLine(p.line.sid,p.line.lid,{match:'s:'+id+':'+i,cat:null})});
  if(cart.bookingId&&mem.bookings[cart.bookingId])write('bookings',cart.bookingId,'update',{status:'done',saleId:id,closedTs:now});
  upsertCust(sale.cust,'s'+id,{t:now,amt:sale.total,svc:sale.items.filter(i=>i.track===false).reduce((a,i)=>a+i.qty,0),kind:'sale'});
  sale.items.forEach((it,i)=>{if(it.track!==false&&mem.products[it.pid])write('products',it.pid,'update',{ev:{['s'+id+'_'+i]:{d:-it.qty,r:'sale',u:me.role,t:now}}})});
  sale.items.forEach(it=>compactIfBig(it.pid));
  resetCart();pay=null;
  render();showReceipt(id,'sales');
}

/* receipts */
function receiptText(doc,kind){
  const s=S();const W=32;const line=(a,b)=>{a=String(a);b=String(b);const sp=Math.max(1,W-a.length-b.length);return a+' '.repeat(sp)+b};const rule='-'.repeat(W);
  let o=s.shopName.toUpperCase()+'\n'+(s.phone?'Tel '+s.phone+'\n':'')+rule+'\n';
  o+=(kind==='laybys'?'LAY-BY ':'RECEIPT ')+doc.no+'\n'+new Date(doc.ts).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'})+'\n';
  if(doc.cust&&doc.cust.name)o+='Customer: '+doc.cust.name+'\n';
  o+=rule+'\n';
  (doc.items||[]).forEach(it=>{o+=it.name+(it.variant?' ('+it.variant+')':'')+'\n'+line('  '+it.qty+' x '+P(it.price),P(it.qty*it.price))+'\n'});
  o+=rule+'\n';
  if(doc.disc)o+=line('Subtotal',P(doc.sub))+'\n'+line('Discount','-'+P(doc.disc))+'\n';
  o+=line('TOTAL',P(doc.total))+'\n';
  if(kind==='laybys'){const pd=paidOf(doc);Object.values(doc.pays||{}).sort((a,b)=>a.t-b.t).forEach(p=>{o+=line((p.a<0?'Refund ':'Paid ')+niceDay(p.day),P(p.a)+' '+p.m.split(' ')[0])+'\n'});o+=line('BALANCE',P(doc.total-pd))+'\n'+'Collect by '+niceDay(doc.due)+'\n'+(S().cancelPolicy==='forfeit'?'Deposit is forfeited if not collected.\n':'')}
  else{(doc.pays||[]).forEach(p=>{o+=line(p.m==='Cash'?'Cash tendered':p.m,P(p.a))+'\n';if(p.ref||p.id)o+='  Ref '+(p.ref||p.id)+'\n'});if(doc.change)o+=line('Change',P(doc.change))+'\n';if(doc.status==='void')o+='*** VOIDED ***\n'}
  o+=rule+'\n'+s.footer+'\n';return o;
}
function showReceipt(id,kind){
  const doc=mem[kind][id];if(!doc)return;const txt=receiptText(doc,kind);const ph=((doc.cust&&doc.cust.phone)||'').replace(/\D/g,'');const wa=ph?'https://wa.me/'+(ph.length<=8?'267'+ph:ph)+'?text='+encodeURIComponent(txt):'';
  modal(hd(kind==='laybys'?'Lay-by slip':'Sale complete',doc.no)+(kind==='sales'&&doc.change>0&&Date.now()-doc.ts<600000?'<div class="panel" style="background:var(--good-soft);text-align:center"><div class="label">Give the customer change</div><b class="num" style="font-family:var(--display);font-size:40px;color:var(--good)">'+P(doc.change)+'</b></div>':'')+'<div class="receipt" id="rtxt">'+h(txt)+'</div><div class="row"><button class="btn primary" data-act="copyr">Copy receipt</button>'+(wa?'<a class="btn" href="'+h(wa)+'" target="_blank" rel="noopener">Send on WhatsApp</a>':'')+'<button class="btn" data-act="close">Done</button></div><div class="sub">Copy, then paste into WhatsApp or SMS. Bluetooth receipt printing comes with the Android app.</div>');
}

function openNewLayby(){
  if(!cart.lines.length)return;const s=S();const t=cartTotals();
  if(needsApproval()){toast('This discount needs the owner. Reduce it or ask the owner to log in.');return}
  const min=Math.round(t.total*s.laybyMinDep/100);
  modal(hd('New lay-by','Total '+P(t.total)+' · minimum deposit '+s.laybyMinDep+'% ('+P(min)+')')+
   '<div class="grid2"><label class="fld"><span>Customer name</span><input class="f" id="lbn" value="'+h(cart.cust.name)+'" autofocus></label><label class="fld"><span>Phone (WhatsApp)</span><input class="f" id="lbp" inputmode="tel" value="'+h(cart.cust.phone)+'"></label></div>'+
   '<div class="grid2"><label class="fld"><span>Deposit</span><input class="f num" id="lbd" inputmode="decimal" value="'+asP(min)+'"></label><label class="fld"><span>Collect by</span><input class="f" id="lbdue" type="date" value="'+addDays(dayStr(),s.laybyDays)+'"></label></div>'+
   '<div class="label">Deposit paid by</div><div class="methods" role="group" id="lbm">'+METHODS.map((m,i)=>'<button data-act="lbm" data-m="'+m+'" aria-pressed="'+(i===0)+'">'+m+'</button>').join('')+'</div>'+
   '<label class="fld"><span>Transaction ID · or paste the SMS</span><input class="f" id="lbr" autocomplete="off"></label><div class="err" id="lberr"></div>'+
   '<button class="btn primary big" data-act="lbsave">Start lay-by</button><div class="sub">Items are set aside and removed from what can be sold until the lay-by is collected or cancelled.</div>');smartPaste('#lbr','#lbd','#lbm',t.total);
}
function saveLayby(){
  const s=S();const t=cartTotals();const name=$('#lbn').value.trim(),phone=$('#lbp').value.trim(),dep=toT($('#lbd').value),due=$('#lbdue').value,m=($('#lbm [aria-pressed="true"]')||{}).dataset?.m||'Cash',ref=$('#lbr').value.trim();
  const min=Math.round(t.total*s.laybyMinDep/100);const err=$('#lberr');
  if(!name||!phone){err.textContent='Enter the customer name and phone. You need them to follow up.';return}
  if(dep<min&&!isOwner()){err.textContent='Deposit must be at least '+P(min)+'. The owner can accept less.';return}
  if(ref&&m!=='Cash'&&m!=='EFT'){const own=refOwner(ref);if(own){err.textContent='Transaction ID already used on '+own+'.';return}}
  if(dep<=0||dep>t.total){err.textContent='Deposit must be more than P0 and no more than the total.';return}
  upsertCust({name,phone});
  const id=uid(),pid=uid(),now=Date.now();
  write('laybys',id,'set',{no:nextNo('LB'),ts:now,day:dayStr(),user:me.role,cust:{name,phone},items:cart.lines.map(l=>({pid:l.pid,name:l.name,variant:l.variant,cat:l.cat,qty:l.qty,price:l.price,cost:l.cost,track:l.track})),sub:t.sub,disc:t.disc,total:t.total,due:due||addDays(dayStr(),s.laybyDays),status:'active',pays:{[pid]:{a:dep,m,ref,t:now,day:dayStr(),u:me.role}}});
  resetCart();
  view='layby';laybyTab='active';render();showReceipt(id,'laybys');
}
function vLayby(){

  const closed=all.filter(l=>l.status!=='active').sort((a,b)=>(b.closedTs||b.ts)-(a.closedTs||a.ts)).slice(0,60);
  const owed=act.reduce((s,l)=>s+l.total-paidOf(l),0);const overdue=act.filter(l=>l.due<today).length;
  const list=laybyTab==='active'?act:closed;
  $('#main').innerHTML='<div class="view"><div class="spread"><div><h1 class="title">Lay-by</h1><div class="sub num">'+act.length+' active · '+P(owed)+' still owed'+(overdue?' · <b style="color:var(--bad)">'+overdue+' overdue</b>':'')+'</div></div><div class="seg"><button data-act="lbtab" data-t="active" aria-pressed="'+(laybyTab==='active')+'">Active</button><button data-act="lbtab" data-t="closed" aria-pressed="'+(laybyTab==='closed')+'">Closed</button></div></div>'+
   (list.length?'<div class="cards">'+list.map(l=>{const pd=paidOf(l),bal=l.total-pd,pct=Math.max(0,Math.min(100,pd/l.total*100));const od=l.status==='active'&&l.due<today;
     const st=l.status==='active'?(bal<=0?'<span class="pill good">Paid up · ready to collect</span>':od?'<span class="pill bad">Overdue</span>':'<span class="pill acc">Due '+niceDay(l.due)+'</span>'):l.status==='collected'?'<span class="pill good">Collected</span>':'<span class="pill mute">Cancelled'+(l.outcome?' · '+h(l.outcome):'')+'</span>';
     return '<div class="card"><div class="spread"><div style="min-width:0"><div style="font-weight:700">'+h(l.cust.name)+'</div><div class="sub">'+h(l.no)+' · '+h(l.cust.phone)+'</div></div>'+st+'</div><div class="sub">'+(l.items||[]).map(i=>h(i.qty+'× '+i.name+(i.variant?' ('+i.variant+')':''))).join(', ')+'</div><div class="meter" aria-hidden="true"><i style="width:'+pct+'%"></i></div><div class="spread num"><span>Paid '+P(pd)+' of '+P(l.total)+'</span><b>'+(bal>0?P(bal)+' left':'')+'</b></div>'+
       (l.status==='active'?'<div class="row"><button class="btn sm primary" data-act="lbcollect" data-id="'+l.id+'" '+(bal>0?'disabled':'')+'>Collect</button>'+(bal>0?'<button class="btn sm" data-act="lbpay" data-id="'+l.id+'">Take payment</button>':'')+'<button class="btn sm" data-act="lbslip" data-id="'+l.id+'">Slip</button>'+(isOwner()?'<button class="btn sm danger" data-act="lbcancel" data-id="'+l.id+'">Cancel</button>':'')+'</div>':'<div class="row"><button class="btn sm" data-act="lbslip" data-id="'+l.id+'">Slip</button></div>')+'</div>'}).join('')+'</div>'

function dayFigures(day){
  const exp={};METHODS.forEach(m=>exp[m]=0);let salesN=0,salesT=0,lbIn=0,refunds=0;const eftPending=[];
  Object.entries(mem.sales).forEach(([id,s])=>{if(s.day!==day||s.status==='void'||s.fromLayby)return;salesN++;salesT+=s.total;(s.pays||[]).forEach((p,i)=>{if(exp[p.m]!=null)exp[p.m]+=p.a});exp.Cash-=(s.change||0)});
  [...Object.values(mem.laybys),...Object.values(mem.bookings)].forEach(l=>Object.values(l.pays||{}).forEach(p=>{if(p.day===day&&exp[p.m]!=null){exp[p.m]+=p.a;if(p.a<0)refunds+=-p.a;else lbIn+=p.a}}));
  let cashOut=0;Object.values(mem.expenses).forEach(e=>{if(!e.void&&e.day===day&&e.from==='Cash drawer'){exp.Cash-=e.a;cashOut+=e.a}});
  return {exp,salesN,salesT,lbIn,refunds,cashOut};
}
function eftPendingList(){const out=[];Object.entries(mem.sales).forEach(([id,s])=>{if(s.status==='void')return;(s.pays||[]).forEach((p,i)=>{if(p.m==='EFT'&&!(s.eftOk||{})[i])out.push({id,i,s,p})})});return out.sort((a,b)=>a.s.ts-b.s.ts)}
function vCash(){
  if(!isOwner())cashDay=dayStr();const st=S();const f=dayFigures(cashDay);const saved=mem.cashups[cashDay];const prev=mem.cashups[addDays(cashDay,-1)];const fl=saved?saved.float:(prev&&prev.nextFloat!=null?prev.nextFloat:st.float);

function upsertCust(c,visitKey,visit){

  if(!mem.customers[id])write('customers',id,'set',{name:c.name||'',phone:normPhone(c.phone),createdAt:now,notes:'',birthday:'',visits:{}});
  else if(c.name&&c.name!==mem.customers[id].name)write('customers',id,'update',{name:c.name});
  if(visitKey)write('customers',id,'update',{visits:{[visitKey]:visit}});
  return id;
}
function custStats(c){let n=0,svc=0,amt=0,last=0;Object.values((c&&c.visits)||{}).forEach(v=>{if(v.void)return;n++;svc+=(+v.svc||0);amt+=(+v.amt||0);if(v.t>last)last=v.t});return {n,svc,amt,last,noshows:Object.keys((c&&c.noshows)||{}).length}}
function loyalty(c){const s=S();const every=+s.loyaltyEvery||0;if(!every||!c)return null;const st=custStats(c);const into=st.svc%every;return {every,into,due:into===every-1,pct:+s.loyaltyPct||0,left:every-1-into}}
function custMatches(name,phone,act){
  const n=String(name||'').trim().toLowerCase(),p=normPhone(phone);if(!n&&!p)return '';
  const hits=Object.entries(mem.customers).filter(([id,c])=>(n&&c.name.toLowerCase().includes(n))||(p&&p.length>=3&&c.phone.includes(p))).slice(0,6);
  if(!hits.length)return '<div class="sub">New customer. She will be saved when you finish.</div>';
  return '<div class="label">Existing customers</div>'+hits.map(([id,c])=>{const st=custStats(c);return '<button class="pick" data-act="'+act+'" data-id="'+id+'"><span><b>'+h(c.name)+'</b> <span class="sub">'+h(c.phone)+'</span></span><span class="sub">'+st.n+' visit'+(st.n===1?'':'s')+'</span></button>'}).join('');
}

    if(lo.due)o+='<div class="r"><span class="pill acc">Loyalty reward due: '+lo.pct+'% off a service</span>'+(applied?'<span class="pill good">Applied</span>':hasSvc?'<button class="btn sm" data-act="reward">Apply</button>':'')+'</div>';
    else o+='<div class="r sub"><span>Loyalty</span><span>'+lo.into+' of '+lo.every+' · reward in '+(lo.left+1)+'</span></div>';}

function applyReward(){const c=mem.customers[custId(cart.cust.phone)];const lo=loyalty(c);if(!lo||!lo.due)return;const svc=cart.lines.filter(l=>!l.track&&!l.reward).sort((a,b)=>b.price-a.price)[0];if(!svc)return;

const toMin=t=>{const p=String(t||'0:0').split(':');return (+p[0]||0)*60+(+p[1]||0)};
const fromMin=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const services=()=>products().filter(isService).sort((a,b)=>label(a).localeCompare(label(b)));
const bookingsOn=d=>Object.entries(mem.bookings).map(([id,b])=>Object.assign({id},b)).filter(b=>b.date===d).sort((a,b)=>toMin(a.start)-toMin(b.start));
const live=b=>b.status==='booked'||b.status==='arrived';
const bkPaid=b=>Object.values((b&&b.pays)||{}).reduce((s,x)=>s+(+x.a||0),0);

function clash(date,start,mins,ignoreId){const s0=toMin(start),e0=s0+mins;return bookingsOn(date).find(b=>b.id!==ignoreId&&live(b)&&toMin(b.start)<e0&&toMin(b.start)+(+b.mins||60)>s0)}

function vBookings(){

  const active=bs.filter(b=>b.status!=='cancelled'&&b.status!=='noshow');const val=active.reduce((a,b)=>a+(+b.price||0),0);
  const used=active.reduce((a,b)=>a+(+b.mins||60),0);const util=close>open?Math.min(100,used/(close-open)*100):0;
  const tmr=addDays(today,1);const rem=bookDay===today?bookingsOn(tmr).filter(b=>b.status==='booked'):[];

    else{const past=bookDay<today||(bookDay===today&&t+slot<=nowMin);rows+='<button class="slot'+(past?' past':'')+'" data-act="newbook" data-t="'+fromMin(t)+'"><span class="num">'+fromMin(t)+'</span><span>'+(past?'Free':'Free · tap to book')+'</span></button>';t+=slot;}
  }

  $('#main').innerHTML='<div class="view" style="max-width:900px"><div class="spread"><div><h1 class="title">Bookings</h1><div class="sub">'+dayLabel(bookDay)+(bookDay===today?' · today':'')+'</div></div><div class="daynav"><button class="btn sm" data-act="bkday" data-d="'+addDays(bookDay,-1)+'" aria-label="Previous day">‹</button><button class="btn sm" data-act="bkday" data-d="'+today+'">Today</button><button class="btn sm" data-act="bkday" data-d="'+addDays(bookDay,1)+'" aria-label="Next day">›</button><input class="f" type="date" id="bkdate" value="'+bookDay+'" style="max-width:170px" aria-label="Pick a day"><button class="btn primary" data-act="newbook" data-t="">New booking</button></div></div>'+
   '<div class="kpis"><div class="kpi"><span class="label">Booked</span><b class="num">'+active.length+'</b><span class="sub">'+P(val)+' in services</span></div><div class="kpi"><span class="label">Chair busy</span><b class="num">'+util.toFixed(0)+'%</b><div class="meter" style="margin-top:6px"><i style="width:'+util+'%"></i></div></div><div class="kpi"><span class="label">Deposits held</span><b class="num">'+P(active.filter(live).reduce((a,b)=>a+bkPaid(b),0))+'</b></div></div>'+
   (rem.length?'<div class="panel stack"><div class="spread"><div><div class="label">Remind tomorrow\'s customers</div><div class="sub">Reminders cut no-shows. Tap to open WhatsApp with the message ready.</div></div><span class="pill '+(rem.every(b=>b.reminded)?'good':'warn')+'">'+rem.filter(b=>b.reminded).length+' of '+rem.length+' sent</span></div><div class="stack">'+rem.map(b=>{const wa=waLink(b.cust.phone,'Hi '+b.cust.name+', this is '+s.shopName+' reminding you of your '+b.service+' tomorrow ('+dayLabel(b.date)+') at '+b.start+'. Please reply YES to confirm. Thank you!');return '<div class="pick"><span><b class="num">'+b.start+'</b> '+h(b.cust.name)+' <span class="sub">'+h(b.service)+'</span></span>'+(wa?'<a class="btn sm'+(b.reminded?'':' primary')+'" data-act="remind" data-id="'+b.id+'" href="'+h(wa)+'" target="_blank" rel="noopener">'+(b.reminded?'Sent ✓':'Send reminder')+'</a>':'<span class="sub">No phone</span>')+'</div>'}).join('')+'</div></div>':'')+
   (services().length?'':'<div class="banner"><b>No services set up.</b> Add nail and weave services under Stock with "This is a service" ticked, including how long each takes.</div>')+
   '<div class="agenda">'+rows+'</div>'+
   (other.length?'<div class="label">Other bookings this day</div><div class="agenda">'+other.map(b=>bookCard(b,s)).join('')+'</div>':'')+'</div>';

const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};

    if(/\b(sent|paid to|payment to|debited|withdraw\w*|purchase\w*|transferred to|you have paid|bought|cash out)\b/i.test(msg)&&!/\b(received|credited)\b/i.test(msg))amt=-amt;
    const rf=msg.match(/(?:trans(?:action)?\.?\s*(?:id|ref|no)?|txn\s*(?:id)?|ref(?:erence)?(?:\s*no)?)\s*[:#.]?\s*([A-Z0-9][A-Z0-9.\-]{5,})/i);
    const date=parseDateAny(msg)||dayStr();
    out.push({date,amt,ref:rf?rf[1].replace(/[.\-]+$/,''):'',desc:msg.replace(/\s+/g,' ').slice(0,160)});
    const fee=msg.match(/(?:fee|charge)s?\s*(?:of|:|is)?\s*(?:BWP|P)\s?([0-9][0-9,]*(?:\.[0-9]{1,2})?)/i);

  });
  return out;
}

function plData(m){
  const [f,t]=monthRange(m);const inM=d=>d>=f&&d<=t;
  const sales=Object.values(mem.sales).filter(s=>s.status!=='void'&&inM(s.day));
  const rev={},cogs={};sales.forEach(s=>{const r=s.sub?s.total/s.sub:1;(s.items||[]).forEach(it=>{const k=it.cat||'Other';rev[k]=(rev[k]||0)+it.price*it.qty*r;cogs[k]=(cogs[k]||0)+(it.cost||0)*it.qty})});
  const R=Object.values(rev).reduce((a,b)=>a+b,0),C=Object.values(cogs).reduce((a,b)=>a+b,0);
  const other={};const add=(o,k,v)=>{if(v)o[k]=(o[k]||0)+v};
  [...Object.values(mem.laybys),...Object.values(mem.bookings)].forEach(x=>{if(x.forfeit&&x.closedTs&&inM(dayStr(new Date(x.closedTs))))add(other,'Forfeited deposits',x.forfeit)});
  const exp={};let draw=0,stock=0;
  expensesList().forEach(e=>{if(!inM(e.day))return;if(e.cat==='Owner drawings')draw+=e.a;else if(e.cat==='Stock purchase')stock+=e.a;else add(exp,e.cat,e.a)});
  ACCOUNTS.forEach(a=>stLines(a).forEach(l=>{if(!inM(l.date)||l.match)return;if(l.cat==='fee')add(exp,'Bank & wallet fees',-l.amt);else if(l.cat==='drawing')draw+=-l.amt;else if(l.cat==='income')add(other,'Other income',l.amt);else if(l.cat==='unrung')add(other,'Payments not rung up',l.amt)}));
  const O=Object.values(other).reduce((a,b)=>a+b,0),E=Object.values(exp).reduce((a,b)=>a+b,0);
  return {rev,cogs,R,C,G:R-C,other,O,exp,E,N:R-C+O-E,draw,stock,n:sales.length};
}

/* ---------- transaction IDs: read from SMS, pick from received payments, block reuse ---------- */
function smsPick(text){
  const ls=parseSMS(text).filter(l=>!l.fee);if(!ls.length)return null;const l=ls[0];let ref=l.ref||'';
  if(!ref){const tk=(String(text).toUpperCase().match(/\b(?=[A-Z0-9.\-]*[A-Z])(?=[A-Z0-9.\-]*\d)[A-Z0-9][A-Z0-9.\-]{6,}[A-Z0-9]\b/g)||[]).filter(x=>!/^(BWP|P)?\d[\d,.]*$/.test(x));ref=tk[0]||''}
  ref=ref.replace(/[.\-]+$/,'');let m=null;
  if(/orange/i.test(text))m='Orange Money';else if(/myzaka|mascom/i.test(text))m='MyZaka';else if(/smega|\bbtc\b/i.test(text))m='Smega';else if(/\b(fnb|absa|stanbic|standard\s*chartered|first\s*capital|bank\s*gaborone|access\s*bank|bbs|bank)\b/i.test(text))m='EFT';
  return {ref,a:Math.abs(l.amt),m};
}
function refOwner(ref){
  ref=String(ref||'').trim().replace(/[.\-]+$/,'').toUpperCase();if(ref.length<4)return null;const same=r=>String(r||'').trim().replace(/[.\-]+$/,'').toUpperCase()===ref;
  for(const s of Object.values(mem.sales)){if(s.status==='void')continue;if((s.pays||[]).some(p=>METHODS.includes(p.m)&&p.m!=='Cash'&&same(p.ref)))return 'sale '+s.no}
  for(const [col,nm] of [[mem.laybys,'lay-by'],[mem.bookings,'booking']])for(const d of Object.values(col))if(Object.values(d.pays||{}).some(p=>p.a>0&&p.m!=='Cash'&&same(p.ref)))return nm+' '+(d.no||(d.cust&&d.cust.name)||'');
  if(pay&&pay.pays&&pay.pays.some(p=>p.m!=='Cash'&&same(p.ref)))return 'this sale';
  return null;
}

  const ls=stLines(acc).filter(l=>l.amt>0&&!l.match&&!l.cat&&l.date>=cut&&!refOwner(l.ref)&&!pay.pays.some(p=>p.line&&p.line.lid===l.lid)).sort((a,b)=>Math.abs(a.amt-left)-Math.abs(b.amt-left)).slice(0,4);

function wireRef(left){

  const chk=()=>{const own=refOwner(r.value);hint.innerHTML=own?'<span class="pill bad">Already used on '+h(own)+'</span> '+(pay.method==='EFT'?'Check this is not the same proof of payment twice.':'Mobile money IDs are only used once. Check the SMS.'):(pay.draft&&pay.draft.msg&&r.value===pay.draft.ref?pay.draft.msg:'')};

function openClearTest(){
  modal(hd('Clear test data','Use this once, before the shop starts trading on the till.')+'<div class="banner"><b>This cannot be undone.</b> Download a backup first if you might want the test records.</div><div class="stack">'+
   [['tx','Sales, lay-bys, bookings, cash-ups, expenses and imported statements',1],['cu','Customers',1],['ex','Example products',1],['zs','Set every stock quantity to zero, ready for your opening stock count (recommended)',1]].map(([k,t,c])=>'<label class="row" style="gap:8px;flex-wrap:nowrap;align-items:flex-start"><input type="checkbox" id="ct_'+k+'"'+(c?' checked':'')+'> <span>'+t+'</span></label>').join('')+
   '</div><div class="sub">Products, prices, services and settings stay.</div><div class="grid2"><label class="fld"><span>Type CLEAR to confirm</span><input class="f" id="ctok" autocomplete="off"></label><label class="fld"><span>Owner PIN</span><input class="f num" id="ctpin" type="password" inputmode="numeric" maxlength="4"></label></div><div class="err" id="cterr"></div><button class="btn danger big" data-act="cleardo">Clear test data</button>');
}
async function doClearTest(){
  if($('#ctok').value.trim().toUpperCase()!=='CLEAR'){$('#cterr').textContent='Type CLEAR to confirm.';return}
  if(await sha($('#ctpin').value)!==(S().ownerPinH||DEF_OWNER_H)){$('#cterr').textContent='Owner PIN is not right.';return}
  const o={tx:$('#ct_tx').checked,cu:$('#ct_cu').checked,ex:$('#ct_ex').checked,zs:$('#ct_zs').checked};$('#cterr').textContent='Working…';
  const {data}=await fullDump();let n=0;
  if(o.tx)['sales','laybys','bookings','cashups','expenses','statements'].forEach(c=>Object.keys(data[c]||{}).forEach(id=>{write(c,id,'delete');n++}));
  if(o.cu)Object.keys(data.customers||{}).forEach(id=>{write('customers',id,'delete');n++});
  Object.entries(data.products||{}).forEach(([id,p])=>{if(o.ex&&p.example){write('products',id,'delete');n++}else if(o.zs&&p.ev&&Object.keys(p.ev).length){const d=clone(p);d.ev={};d.updatedAt=Date.now();write('products',id,'set',d);n++}});
  closeModal();cashDay=dayStr();histDay=dayStr();bookDay=dayStr();render();toast(n+' records cleared. The till is ready for real trading.');
}
function compactIfBig(pid){const p=mem.products[pid];if(!p||!p.ev||Object.keys(p.ev).length<1500)return;const d=clone(p);d.ev={['b'+uid()]:{d:onHand(p),r:'balance carried forward',u:'system',t:Date.now()}};write('products',pid,'set',d)}

/* ---------- events ---------- */
async function copy(text){try{await navigator.clipboard.writeText(text);toast('Copied')}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Copied')}catch(_){toast('Select the text and copy it')}ta.remove()}}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  switch(a){
  case 'scrim':if(e.target===b)closeModal();break;
  case 'close':closeModal();break;
  case 'role':loginRole=b.dataset.r;pinBuf='';loginErr='';renderLogin();break;
  case 'pin':if(pinBuf.length<4){pinBuf+=b.dataset.n;loginErr='';renderLogin();if(pinBuf.length===4)tryPin()}break;
  case 'pindel':pinBuf=pinBuf.slice(0,-1);renderLogin();break;
  case 'pinclr':pinBuf='';renderLogin();break;
  case 'lock':setMe(null);try{sessionStorage.removeItem('vf:me')}catch(_){}pinBuf='';$('#main').innerHTML='';render();break;
  case 'nav':view=b.dataset.v;$('#main').innerHTML='';closeModal();render();$('#main').scrollTop=0;break;
  case 'more':modal(hd('More')+'<div class="stack">'+NAV.slice(4).filter(n=>!n[3]||isOwner()).map(n=>'<button class="btn big" data-act="nav" data-v="'+n[0]+'">'+n[1]+'</button>').join('')+'<button class="btn big" data-act="lock">Lock till</button></div>');break;
  case 'cat':sellCat=b.dataset.c;drawCats();drawWall();break;
  case 'add':addToCart(id);break;
  case 'qty':{const l=cart.lines[+b.dataset.i];l.qty+=+b.dataset.d;if(l.qty<=0)cart.lines.splice(+b.dataset.i,1);drawBasket();refreshSheetBasket();break}
  case 'clearcart':resetCart();drawBasket();refreshSheetBasket();break;
  case 'basket':openBasketSheet();break;
  case 'lineprice':{const l=cart.lines[+b.dataset.i];modal(hd('Change price',l.name+' · this sale only')+'<label class="fld"><span>Price each</span><input class="f num" id="lpv" inputmode="decimal" value="'+asP(l.price)+'" autofocus></label><button class="btn primary" data-act="lpsave" data-i="'+b.dataset.i+'">Apply</button>');break}
  case 'lpsave':cart.lines[+b.dataset.i].price=toT($('#lpv').value);closeModal();drawBasket();break;
  case 'disc':openDisc();break;
  case 'dtype':cart.discType=b.dataset.t;openDisc();break;
  case 'dsave':{const v=$('#dval').value;cart.disc=cart.discType==='pct'?Math.min(100,Math.max(0,parseFloat(v)||0)):toT(v);closeModal();drawBasket();if(needsApproval())toast('Above the staff limit. The owner PIN will be needed at payment.');break}
  case 'dclear':cart.disc=0;closeModal();drawBasket();break;
  case 'cust':openCust();break;
  case 'custsave':cart.cust={name:$('#cn').value.trim(),phone:$('#cp').value.trim()};closeModal();drawBasket();break;
  case 'charge':openPay();break;
  case 'approve':{const v=$('#appin').value;if(await sha(v)===(S().ownerPinH||DEF_OWNER_H)){pay.approved=true;drawPay()}else toast('Owner PIN not right');break}
  case 'pm':pay.method=b.dataset.m;pay.draft=null;drawPay();break;
  case 'quick':$('#pamt').value=asP(+b.dataset.v);if(pay&&pay.updChange)pay.updChange();break;
  case 'payadd':{const t=cartTotals();const paid=pay.pays.reduce((s,p)=>s+p.a,0);const left=t.total-paid;let amt=toT($('#pamt').value);const ref=($('#pref')||{}).value?.trim()||'';if(amt<=0){toast('Enter an amount');break}if(pay.method!=='Cash'&&amt>left){toast(pay.method+' cannot be more than what is left ('+P(left)+')');break}if(pay.method!=='Cash'&&pay.method!=='EFT'&&!ref){toast('Enter the transaction ID from the payment SMS');break}{const own=pay.method!=='Cash'&&refOwner(ref);if(own&&pay.method!=='EFT'){toast('Transaction ID '+ref+' was already used on '+own+'. Check the SMS.');break}if(own)toast('Warning: this reference was also used on '+own+'.')}
    pay.pays.push({m:pay.method,a:amt,ref,line:pay.draft&&pay.draft.line&&pay.draft.ref===ref?pay.draft.line:null});pay.draft=null;if(pay.method!=='Cash')pay.method='Cash';drawPay();break}
  case 'pickref':{const l=mem.statements[b.dataset.sid].lines[b.dataset.lid];const left=cartTotals().total-pay.pays.reduce((s,p)=>s+p.a,0);const r=(l.ref||l.desc.slice(0,40)).replace(/[.\-]+$/,'');pay.draft={ref:r,a:Math.min(l.amt,left),line:{sid:b.dataset.sid,lid:b.dataset.lid},msg:'<span class="pill good">Picked from received payments</span> '+P(l.amt)+' · '+h(r)};drawPay();break}
  case 'paydel':pay.pays.splice(+b.dataset.i,1);drawPay();break;
  case 'paydone':finishPay();break;
  case 'copyr':copy($('#rtxt').textContent);break;
  case 'newlayby':openNewLayby();break;
  case 'lbm':b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));break;
  case 'lbsave':saveLayby();break;
  case 'lbtab':laybyTab=b.dataset.t;vLayby();break;
  case 'lbpay':openLbPay(id);break;
  case 'lbpaysave':saveLbPay(id);break;
  case 'lbcollect':collectLayby(id);break;
  case 'lbslip':showReceipt(id,'laybys');break;
  case 'lbcancel':openLbCancel(id);break;
  case 'lbcancelsave':saveLbCancel(id);break;
  case 'sf':stockFilter=b.dataset.f;vStock();break;
  case 'addprod':openAddProd();break;
  case 'apgen':genVariants();break;
  case 'apsave':saveProducts();break;
  case 'editprod':openEditProd(id);break;
  case 'epsave':saveEdit(id);break;
  case 'eparch':write('products',id,'update',{active:false,updatedAt:Date.now()});closeModal();render();toast('Item removed from the till. Its sales history stays.');break;
  case 'recv':openRecv(id);break;
  case 'recvsave':saveRecv(id);break;
  case 'count':openCount(id);break;
  case 'countsave':saveCount(id);break;
  case 'import':openImport();break;
  case 'copytpl':copy(TEMPLATE);break;
  case 'impcheck':checkImport();break;
  case 'impsave':saveImport();break;
  case 'cusave':saveCash();break;
  case 'eftok':{const s=mem.sales[id];write('sales',id,'update',{eftOk:{[b.dataset.i]:Date.now()}});render();toast('EFT confirmed: '+s.no);break}
  case 'viewsale':showReceipt(id,'sales');break;
  case 'void':openVoid(id);break;
  case 'voidsave':saveVoid(id);break;
  case 'rp':repPeriod=b.dataset.p;vReports();break;
  case 'custclear':cart.cust={name:'',phone:''};closeModal();drawBasket();break;
  case 'pickcust':{const c=mem.customers[id];if(c){cart.cust={name:c.name,phone:c.phone};closeModal();drawBasket();refreshSheetBasket()}break}
  case 'reward':applyReward();break;
  case 'bkday':bookDay=b.dataset.d;vBookings();break;
  case 'newbook':openBook({t:b.dataset.t});break;
  case 'bkpick':{const c=mem.customers[id];if(c){$('#bkn').value=c.name;$('#bkp').value=c.phone;$('#bkmatch').innerHTML=''}break}
  case 'bksave':saveBook(id||null);break;
  case 'bkedit':openBook({id});break;
  case 'bkarrive':write('bookings',id,'update',{status:'arrived',arrivedTs:Date.now()});render();break;
  case 'bkcheckout':checkoutBooking(id);break;
  case 'bknoshow':{const bk=mem.bookings[id];write('bookings',id,'update',{status:'noshow',closedTs:Date.now(),forfeit:bkPaid(bk)});{const cid=custId(bk.cust.phone);if(cid&&mem.customers[cid])write('customers',cid,'update',{noshows:{[id]:Date.now()}})}render();toast('Marked no-show'+(bkPaid(bk)?'. Deposit kept.':''));break}
  case 'bkcancel':openBkCancel(id);break;
  case 'bkcancelsave':saveBkCancel(id);break;
  case 'remind':write('bookings',id,'update',{reminded:Date.now()});setTimeout(render,400);break;
  case 'cf':custFilter=b.dataset.f;vCustomers();break;
  case 'opencust':openCustomer(id);break;
  case 'newcust':openCustomer(null);break;
  case 'cusave2':saveCustomer(id||null);break;
  case 'custsell':{const c=mem.customers[id];cart.cust={name:c.name,phone:c.phone};closeModal();view='sell';$('#main').innerHTML='';render();toast(c.name+' added to the basket');break}
  case 'custbook':{const c=mem.customers[id];closeModal();openBook({cust:{name:c.name,phone:c.phone}});break}
  case 'payout':openExpense({cashOnly:true});break;
  case 'newexp':openExpense({});break;
  case 'exsave':saveExpense();break;
  case 'exvoid':write('expenses',id,'update',{void:true,voidBy:me.role,voidTs:Date.now()});render();toast('Expense removed');break;
  case 'mtab':moneyTab=b.dataset.t;vMoney();break;
  case 'recacc':recAcc=b.dataset.a;vMoney();break;
  case 'stimport':openStImport();break;
  case 'stparse':showStPreview(parseSMS($('#stt').value));break;
  case 'stcsv':readCsvLines();break;
  case 'stsave':saveStatement();break;
  case 'stauto':{const n=runAuto(recAcc);render();toast(n?n+' more lines matched':'No new matches found');break}
  case 'stline':openStLine(b.dataset.sid,b.dataset.lid);break;
  case 'stpick':setLine(b.dataset.sid,b.dataset.lid,{match:b.dataset.key,cat:null});closeModal();render();toast('Matched');break;
  case 'stcat':setLine(b.dataset.sid,b.dataset.lid,{match:null,cat:b.dataset.c});closeModal();render();toast('Marked: '+(ST_CATS.find(c=>c[0]===b.dataset.c)||['',''])[1]);break;
  case 'stundo':setLine(b.dataset.sid,b.dataset.lid,{match:null,cat:null});closeModal();render();break;
  case 'dl':downloadPack(b.dataset.k);break;
  case 'signout':signOut();break;
  case 'signoutnow':outbox=[];closeModal();signOut();break;
  case 'ssave':saveSettings();break;
  case 'pinsave':savePins();break;
  case 'clearex':{const n=products().filter(p=>p.example);n.forEach(p=>write('products',p.id,'update',{active:false}));render();toast(n.length+' examples removed');break}
  case 'backup':doBackup();break;
  case 'cleartest':openClearTest();break;
  case 'cleardo':doClearTest();break;
  case 'restoredo':doRestore();break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalOpen())closeModal()});

/* ---------- boot ---------- */
(async()=>{DEF_OWNER_H=await sha('1234');DEF_STAFF_H=await sha('0000');if(await startCloud())afterShop();else renderAuth()})();
})();
</script>
